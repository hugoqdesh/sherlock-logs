input {
  beats {
    port => 5044
  }
}

filter {
  if [container][name] == "sherlock-app" {
    mutate {
      replace => { "[log][category]" => "application" }
    }
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  if [app][event] == "request_error" {
    mutate {
      add_tag => ["log_alert"]
      add_field => {
        "[alert][kind]" => "application_error"
        "[alert][severity]" => "critical"
        "[alert][summary]" => "Application request error"
      }
    }
  } else if [app][status_code] and [app][status_code] >= 500 {
    mutate {
      add_tag => ["log_alert"]
      add_field => {
        "[alert][kind]" => "http_5xx"
        "[alert][severity]" => "critical"
        "[alert][summary]" => "Application returned HTTP %{[app][status_code]}"
      }
    }
  } else if [message] =~ /(?i)(fatal|out of memory|\boom\b|authentication failure|failed password)/ {
    mutate {
      add_tag => ["log_alert"]
      add_field => {
        "[alert][kind]" => "critical_log_pattern"
        "[alert][severity]" => "warning"
        "[alert][summary]" => "Critical log pattern matched"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    index => "sherlock-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }

  if "log_alert" in [tags] {
    file {
      id => "sherlock_local_alerts"
      path => "/var/log/logstash/sherlock-alerts.json"
      file_mode => 0640
      flush_interval => 0
    }

    udp {
      id => "sherlock_terminal_alerts"
      host => "127.0.0.1"
      port => 5514
      codec => line {
        format => "<8>sherlock-alert: %{[alert][summary]}"
      }
    }
  }
}
