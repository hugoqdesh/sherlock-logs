- name: Configure machines
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install basic packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - unzip
        state: present

- name: Installing Node on app
  hosts: app
  become: true

  tasks:
    - name: Install Node Exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Start Node Exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

- name: Install Prometheus on monitoring
  hosts: monitoring
  become: true

  tasks:
    - name: Install Prometheus
      ansible.builtin.apt:
        name: prometheus
        state: present

    - name: Configure Prometheus
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: "node"
              static_configs:
                - targets:
                    - "192.168.56.10:9100"

            - job_name: "application"
              static_configs:
                - targets:
                  - "192.168.56.10:3000"
            
            - job_name: "cadvisor"
              static_configs:
                - targets:
                  - "192.168.56.10:8080"

    - name: Restart Prometheus
      ansible.builtin.systemd:
        name: prometheus
        enabled: true
        state: restarted

- name: Install Grafana on monitoring
  hosts: monitoring
  become: true

  tasks:
    - name: Install Grafana dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - software-properties-common
          - wget
        state: present

    - name: Add Grafana GPG key
      ansible.builtin.shell: |
        mkdir -p /etc/apt/keyrings
        wget -q -O /etc/apt/keyrings/grafana.key https://apt.grafana.com/gpg.key
      args:
        creates: /etc/apt/keyrings/grafana.key

    - name: Add Grafana repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/grafana.list
        content: |
          deb [signed-by=/etc/apt/keyrings/grafana.key] https://apt.grafana.com stable main

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present

    - name: Provision Prometheus datasource
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yaml
        mode: "0644"
        content: |
          apiVersion: 1

          datasources:
            - name: prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true
              editable: false
      notify: Restart Grafana

    - name: Create Grafana dashboard directory
      ansible.builtin.file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: "0755"

    - name: Copy Grafana dashboards
      ansible.builtin.copy:
        src: "files/grafana/dashboards/{{ item }}"
        dest: "/var/lib/grafana/dashboards/{{ item }}"
        owner: grafana
        group: grafana
        mode: "0644"
      loop:
        - vm-performance.json
        - docker-containers.json
        - application-performance.json
      notify: Restart Grafana

    - name: Provision Grafana dashboards
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/dashboards/sherlock.yaml
        mode: "0644"
        content: |
          apiVersion: 1

          providers:
            - name: Sherlock Logs
              orgId: 1
              folder: Sherlock Logs
              folderUid: sherlock-logs
              type: file
              disableDeletion: false
              updateIntervalSeconds: 10
              allowUiUpdates: false
              options:
                path: /var/lib/grafana/dashboards
      notify: Restart Grafana

    - name: Start Grafana
      ansible.builtin.systemd:
        name: grafana-server
        enabled: true
        state: started

  handlers:
    - name: Restart Grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted

- name: Deploy application
  hosts: app
  become: true

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/sherlock-app
        state: directory
        mode: "0755"

    - name: Copy application files
      ansible.builtin.copy:
        src: ../app/
        dest: /opt/sherlock-app/

    - name: Build application Docker image
      ansible.builtin.command:
        cmd: docker build -t sherlock-app .
        chdir: /opt/sherlock-app

    - name: Remove old application container
      ansible.builtin.command:
        cmd: docker rm -f sherlock-app
      failed_when: false
      changed_when: false

    - name: Start application container
      ansible.builtin.command:
        cmd: docker run -d --name sherlock-app --restart unless-stopped -p 3000:3000 sherlock-app

- name: Run cAdvisor on app
  hosts: app
  become: true

  tasks:
    - name: Pull cAdvisor image
      ansible.builtin.command:
        cmd: docker pull ghcr.io/google/cadvisor:0.55.1

    - name: Remove old cAdvisor container
      ansible.builtin.command:
        cmd: docker rm -f cadvisor
      failed_when: false
      changed_when: false

    - name: Start cAdvisor
      ansible.builtin.shell: |
        docker run -d \
          --name cadvisor \
          --restart unless-stopped \
          --privileged \
          --device=/dev/kmsg \
          -p 8080:8080 \
          -v /:/rootfs:ro \
          -v /var/run:/var/run:ro \
          -v /sys:/sys:ro \
          -v /var/lib/docker/:/var/lib/docker:ro \
          -v /dev/disk/:/dev/disk:ro \
          ghcr.io/google/cadvisor:0.55.1

- name: Configure Elastic package repository
  hosts: all
  become: true

  tasks:
    - name: Install Elastic repository dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - gnupg
        state: present

    - name: Install Elastic signing key
      ansible.builtin.get_url:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        dest: /usr/share/keyrings/elastic.asc
        mode: "0644"

    - name: Add Elastic repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/elastic-9.x.list
        mode: "0644"
        content: |
          deb [signed-by=/usr/share/keyrings/elastic.asc] https://artifacts.elastic.co/packages/9.x/apt stable main

- name: Install logging stack on monitoring
  hosts: monitoring
  become: true

  tasks:
    - name: Install Elasticsearch, Logstash, and Kibana
      ansible.builtin.apt:
        name:
          - elasticsearch
          - logstash
          - kibana
        state: present
        update_cache: true

    - name: Configure Elasticsearch
      ansible.builtin.copy:
        src: files/elasticsearch/elasticsearch.yml
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: root
        group: elasticsearch
        mode: "0660"
      notify: Restart Elasticsearch

    - name: Limit Elasticsearch memory
      ansible.builtin.copy:
        dest: /etc/elasticsearch/jvm.options.d/heap.options
        owner: root
        group: elasticsearch
        mode: "0644"
        content: |
          -Xms512m
          -Xmx512m
      notify: Restart Elasticsearch

    - name: Start Elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        enabled: true
        state: started

    - name: Wait for Elasticsearch
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/_cluster/health
        status_code: 200
      register: elasticsearch_health
      retries: 30
      delay: 2
      until: elasticsearch_health.status == 200

    - name: Configure Sherlock log index defaults
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/_index_template/sherlock-logs
        method: PUT
        body_format: json
        body:
          index_patterns:
            - sherlock-logs-*
          template:
            settings:
              index:
                number_of_replicas: 0
        status_code: 200

    - name: Apply single-node settings to existing log indices
      ansible.builtin.uri:
        url: http://127.0.0.1:9200/sherlock-logs-*/_settings
        method: PUT
        body_format: json
        body:
          index:
            number_of_replicas: 0
        status_code:
          - 200
          - 404

    - name: Configure Logstash pipeline
      ansible.builtin.copy:
        src: files/logstash/sherlock.conf
        dest: /etc/logstash/conf.d/sherlock.conf
        owner: root
        group: logstash
        mode: "0644"
      notify: Restart Logstash

    - name: Limit Logstash memory
      ansible.builtin.lineinfile:
        path: /etc/logstash/jvm.options
        regexp: "^-Xm{{ item.key }}"
        line: "-Xm{{ item.key }}{{ item.value }}"
      loop:
        - key: s
          value: 512m
        - key: x
          value: 512m
      notify: Restart Logstash

    - name: Start Logstash
      ansible.builtin.systemd:
        name: logstash
        enabled: true
        state: started

    - name: Configure Kibana
      ansible.builtin.copy:
        src: files/kibana/kibana.yml
        dest: /etc/kibana/kibana.yml
        owner: root
        group: kibana
        mode: "0660"
      notify: Restart Kibana

    - name: Limit Kibana memory
      ansible.builtin.lineinfile:
        path: /etc/default/kibana
        regexp: ^NODE_OPTIONS=
        line: NODE_OPTIONS="--max-old-space-size=1024"
        create: true
        mode: "0644"
      notify: Restart Kibana

    - name: Start Kibana
      ansible.builtin.systemd:
        name: kibana
        enabled: true
        state: started

    - name: Wait for Kibana
      ansible.builtin.uri:
        url: http://127.0.0.1:5601/api/status
        status_code: 200
      register: kibana_status
      retries: 60
      delay: 2
      until:
        - kibana_status.status == 200
        - kibana_status.json.status.overall.level == "available"

    - name: Copy Kibana saved objects
      ansible.builtin.copy:
        src: files/kibana/sherlock-dashboards.ndjson
        dest: /etc/kibana/sherlock-dashboards.ndjson
        owner: root
        group: kibana
        mode: "0640"

    - name: Import Kibana saved objects
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --request
          - POST
          - --header
          - "kbn-xsrf: true"
          - --form
          - file=@/etc/kibana/sherlock-dashboards.ndjson
          - http://127.0.0.1:5601/api/saved_objects/_import?overwrite=true
      register: kibana_import
      changed_when: false
      failed_when: not (kibana_import.stdout | from_json).success

  handlers:
    - name: Restart Elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        state: restarted

    - name: Restart Logstash
      ansible.builtin.systemd:
        name: logstash
        state: restarted

    - name: Restart Kibana
      ansible.builtin.systemd:
        name: kibana
        state: restarted

- name: Install Filebeat on every VM
  hosts: all
  become: true

  tasks:
    - name: Install Filebeat
      ansible.builtin.apt:
        name: filebeat
        state: present
        update_cache: true

    - name: Configure Filebeat
      ansible.builtin.template:
        src: templates/filebeat.yml.j2
        dest: /etc/filebeat/filebeat.yml
        owner: root
        group: root
        mode: "0600"
      notify: Restart Filebeat

    - name: Start Filebeat
      ansible.builtin.systemd:
        name: filebeat
        enabled: true
        state: started

  handlers:
    - name: Restart Filebeat
      ansible.builtin.systemd:
        name: filebeat
        state: restarted
