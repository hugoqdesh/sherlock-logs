- name: Configure machines
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install basic packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - unzip
        state: present

- name: Installing Node on app
  hosts: app
  become: true

  tasks:
    - name: Install Node Exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Start Node Exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

- name: Install Prometheus on monitoring
  hosts: monitoring
  become: true

  tasks:
    - name: Install Prometheus
      ansible.builtin.apt:
        name: prometheus
        state: present

    - name: Configure Prometheus
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: "node"
              static_configs:
                - targets:
                    - "192.168.56.10:9100"

            - job_name: "application"
              static_configs:
                - targets:
                  - "192.168.56.10:3000"

    - name: Restart Prometheus
      ansible.builtin.systemd:
        name: prometheus
        enabled: true
        state: restarted

- name: Install Grafana on monitoring
  hosts: monitoring
  become: true

  tasks:
    - name: Install Grafana dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - software-properties-common
          - wget
        state: present

    - name: Add Grafana GPG key
      ansible.builtin.shell: |
        mkdir -p /etc/apt/keyrings
        wget -q -O /etc/apt/keyrings/grafana.key https://apt.grafana.com/gpg.key
      args:
        creates: /etc/apt/keyrings/grafana.key

    - name: Add Grafana repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/grafana.list
        content: |
          deb [signed-by=/etc/apt/keyrings/grafana.key] https://apt.grafana.com stable main

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present

    - name: Start Grafana
      ansible.builtin.systemd:
        name: grafana-server
        enabled: true
        state: started

- name: Deploy application
  hosts: app
  become: true

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/sherlock-app
        state: directory
        mode: "0755"

    - name: Copy application files
      ansible.builtin.copy:
        src: ../app/
        dest: /opt/sherlock-app/

    - name: Build application Docker image
      ansible.builtin.command:
        cmd: docker build -t sherlock-app .
        chdir: /opt/sherlock-app

    - name: Remove old application container
      ansible.builtin.command:
        cmd: docker rm -f sherlock-app
      failed_when: false
      changed_when: false

    - name: Start application container
      ansible.builtin.command:
        cmd: docker run -d --name sherlock-app --restart unless-stopped -p 3000:3000 sherlock-app
